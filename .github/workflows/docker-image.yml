name: Docker Image CI

on: push

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.img.outputs.image }}
    steps:
      - name: Récupérer mon dépôt
        uses: actions/checkout@v4

      - name: Récupérer la source Miniflux
        run: git clone --depth 1 --branch 2.3.3 https://github.com/miniflux/v2.git upstream

      - name: Authentification AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::396608811172:role/gha-miniflux
          aws-region: eu-west-3

      - name: Connexion à ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Définir le nom de l'image
        id: img
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/app-miniflix:${{ github.sha }}
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Construire l'image
        run: docker build -f docker/Dockerfile.v3_minimal -t $IMAGE upstream/

      - name: Vérifier que le binaire s'exécute
        run: docker run --rm $IMAGE miniflux -version
      
      - name: Scanner l'image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Publier dans ECR
        run: docker push $IMAGE

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Authentification AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::396608811172:role/gha-miniflux-deploy
          aws-region: eu-west-3

      - name: Déployer sur l'instance
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0772ebbab8091228b \
            --document-name AWS-RunShellScript \
            --parameters 'commands=[
              "cd /opt/miniflux",
              "sed -i \"s|^MINIFLUX_IMAGE=.*|MINIFLUX_IMAGE=${{ needs.build-and-push.outputs.image }}|\" .env",
              "aws ecr get-login-password --region eu-west-3 | docker login --username AWS --password-stdin 396608811172.dkr.ecr.eu-west-3.amazonaws.com",
              "docker compose pull",
              "docker compose up -d"
            ]' \
            --query Command.CommandId --output text)

          aws ssm wait command-executed \
            --command-id $COMMAND_ID \
            --instance-id i-0772ebbab8091228b

          aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id i-0772ebbab8091228b \
            --query StandardOutputContent --output text
